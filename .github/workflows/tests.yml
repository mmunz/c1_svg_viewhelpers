name: tests

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-22.04
    name: Linting
    steps:
      - uses: actions/checkout@v7
      - name: Add GITHUB_TOKEN if available
        run: if [ -n "${{secrets.GITHUB_TOKEN}}" ]; then composer config github-oauth.github.com ${{secrets.GITHUB_TOKEN}}; fi;
      - name: Install testing system
        run: Build/Scripts/runTests.sh -p 8.4 -t 13 -s composerUpdate
      - name: TypoScript lint
        run: Build/Scripts/runTests.sh -p 8.4 -s typoScriptLint
      - name: Lint php
        run: Build/Scripts/runTests.sh -n -p 8.4 -s lint
      - name: CGL (php-cs-fixer)
        run: Build/Scripts/runTests.sh -n -p 8.4 -s cgl

  phpstan:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - { php: "8.2" }
          - { php: "8.3" }
          - { php: "8.4" }
    name: phpstan on PHP${{ matrix.env.php }}
    steps:
      - uses: actions/checkout@v7
      - name: Add GITHUB_TOKEN if available
        run: if [ -n "${{secrets.GITHUB_TOKEN}}" ]; then composer config github-oauth.github.com ${{secrets.GITHUB_TOKEN}}; fi;
      - name: Install testing system
        run: Build/Scripts/runTests.sh -p ${{ matrix.env.php }} -t 13 -s composerUpdate
      - name: phpstan
        run: Build/Scripts/runTests.sh -n -p ${{ matrix.env.php }} -s phpstan

  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - { php: "8.2", TYPO3_VERSION: 12 }
          - { php: "8.3", TYPO3_VERSION: 12 }
          - { php: "8.4", TYPO3_VERSION: 12 }
          - { php: "8.2", TYPO3_VERSION: 13 }
          - { php: "8.3", TYPO3_VERSION: 13 }
          - { php: "8.4", TYPO3_VERSION: 13 }
    name: Tests on PHP${{ matrix.env.php }} / TYPO3 ${{ matrix.env.TYPO3_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - name: Add GITHUB_TOKEN if available
        run: if [ -n "${{secrets.GITHUB_TOKEN}}" ]; then composer config github-oauth.github.com ${{secrets.GITHUB_TOKEN}}; fi;
      - name: Install testing system
        run: Build/Scripts/runTests.sh -p ${{ matrix.env.php }} -t ${{ matrix.env.TYPO3_VERSION }} -s composerUpdate
      - name: Functional Tests with sqlite
        run: Build/Scripts/runTests.sh -p ${{ matrix.env.php }} -t ${{ matrix.env.TYPO3_VERSION }} -d sqlite -s functional

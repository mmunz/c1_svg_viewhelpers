name: tests

on: [push, pull_request]

# All three jobs only read the checkout and run tests in Docker; none writes
# back through the GitHub API.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    name: Linting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install testing system
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # docker-compose forwards this into the container; .env never sees it.
          if [ -n "$GITHUB_TOKEN" ]; then
            export COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"$GITHUB_TOKEN\"}}"
          fi
          Build/Scripts/runTests.sh -p 8.4 -t 13 -s composerUpdate
      - name: TypoScript lint
        run: Build/Scripts/runTests.sh -p 8.4 -s typoScriptLint
      - name: Lint php
        run: Build/Scripts/runTests.sh -n -p 8.4 -s lint
      - name: CGL (php-cs-fixer)
        run: Build/Scripts/runTests.sh -n -p 8.4 -s cgl

  phpstan:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - { php: "8.2" }
          - { php: "8.3" }
          - { php: "8.4" }
    name: phpstan on PHP${{ matrix.env.php }}
    # Through the environment, not interpolated into run:. Not named PHP_VERSION,
    # which runTests.sh assigns itself.
    env:
      MATRIX_PHP: ${{ matrix.env.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install testing system
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # docker-compose forwards this into the container; .env never sees it.
          if [ -n "$GITHUB_TOKEN" ]; then
            export COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"$GITHUB_TOKEN\"}}"
          fi
          Build/Scripts/runTests.sh -p "$MATRIX_PHP" -t 13 -s composerUpdate
      - name: phpstan
        run: Build/Scripts/runTests.sh -n -p "$MATRIX_PHP" -s phpstan

  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - { php: "8.2", TYPO3_VERSION: 12 }
          - { php: "8.3", TYPO3_VERSION: 12 }
          - { php: "8.4", TYPO3_VERSION: 12 }
          - { php: "8.2", TYPO3_VERSION: 13 }
          - { php: "8.3", TYPO3_VERSION: 13 }
          - { php: "8.4", TYPO3_VERSION: 13 }
    name: Tests on PHP${{ matrix.env.php }} / TYPO3 ${{ matrix.env.TYPO3_VERSION }}
    env:
      MATRIX_PHP: ${{ matrix.env.php }}
      MATRIX_TYPO3: ${{ matrix.env.TYPO3_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install testing system
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # docker-compose forwards this into the container; .env never sees it.
          if [ -n "$GITHUB_TOKEN" ]; then
            export COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"$GITHUB_TOKEN\"}}"
          fi
          Build/Scripts/runTests.sh -p "$MATRIX_PHP" -t "$MATRIX_TYPO3" -s composerUpdate
      - name: Unit Tests
        run: Build/Scripts/runTests.sh -p "$MATRIX_PHP" -t "$MATRIX_TYPO3" -s unit
      - name: Functional Tests with sqlite
        run: Build/Scripts/runTests.sh -p "$MATRIX_PHP" -t "$MATRIX_TYPO3" -d sqlite -s functional

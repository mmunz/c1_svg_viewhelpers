services:
  composer_update:
    image: ghcr.io/typo3/core-testing-${DOCKER_PHP_IMAGE}:latest
    tty: true
    user: "${HOST_UID}"
    volumes:
      - ${ROOT_DIR}:${ROOT_DIR}
    working_dir: ${ROOT_DIR}
    environment:
      COMPOSER_CACHE_DIR: ".Build/.cache/composer"
    command: >
      /bin/sh -c "
        if [ ${SCRIPT_VERBOSE} -eq 1 ]; then
          set -x
        fi
        php -v | grep '^PHP';
        if [ ${TYPO3_VERSION} -eq 12 ]; then
            composer req --dev --no-update \\
               "typo3/cms-composer-installers:^5.0" \\
               "sbuerk/typo3-cmscomposerinstallers-testingframework-bridge":^0.0.1 \\
                typo3/cms-backend:^12 \\
                typo3/cms-frontend:^12 \\
                typo3/cms-extbase:^12 \\
                typo3/cms-fluid:^12 \\
                typo3/cms-install:^12
            composer req typo3/cms-core:^12 -W --no-update
        fi
        if [ ${TYPO3_VERSION} -eq 13 ]; then
            composer req --dev --no-update \\
               "typo3/cms-composer-installers:^5.0" \\
               "sbuerk/typo3-cmscomposerinstallers-testingframework-bridge":^0.0.1 \\
                typo3/cms-backend:^13 \\
                typo3/cms-frontend:^13 \\
                typo3/cms-extbase:^13 \\
                typo3/cms-fluid:^13 \\
                typo3/cms-install:^13
            composer req typo3/cms-core:^13 -W --no-update
        fi
        composer update --no-progress --no-interaction --no-blocking;
      "


  cgl:
    image: ghcr.io/typo3/core-testing-${DOCKER_PHP_IMAGE}:latest
    user: "${HOST_UID}"
    volumes:
      - ${ROOT_DIR}:${ROOT_DIR}
    working_dir: ${ROOT_DIR}
    environment:
      PHP_CS_FIXER_IGNORE_ENV: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      /bin/sh -c "
        if [ ${SCRIPT_VERBOSE} -eq 1 ]; then
          set -x
        fi
        php -v | grep '^PHP';
        if [ ${PHP_XDEBUG_ON} -eq 0 ]; then
          php -dxdebug.mode=off \\
            .Build/vendor/bin/php-cs-fixer fix \\
              -v \\
              ${CGLCHECK_DRY_RUN} \\
              --config=.php-cs-fixer.dist.php  \\
              --using-cache=no .
        else
          XDEBUG_MODE=\"debug,develop\" \\
          XDEBUG_TRIGGER=\"foo\" \\
          XDEBUG_CONFIG=\"client_port=${PHP_XDEBUG_PORT} client_host=host.docker.internal\" \\
          PHP_CS_FIXER_ALLOW_XDEBUG=1 \\
          .Build/vendor/bin/php-cs-fixer fix \\
            -v \\
            ${CGLCHECK_DRY_RUN} \\
            --config=.php-cs-fixer.dist.php  \\
            --using-cache=no .
        fi
      "

  typoScriptLint:
    image: ghcr.io/typo3/core-testing-${DOCKER_PHP_IMAGE}:latest
    user: "${HOST_UID}"
    volumes:
      - ${ROOT_DIR}:${ROOT_DIR}
    working_dir: ${ROOT_DIR}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      /bin/sh -c "
        if [ ${SCRIPT_VERBOSE} -eq 1 ]; then
          set -x
        fi
        php -v | grep '^PHP';
        if [ ${PHP_XDEBUG_ON} -eq 0 ]; then
          php -dxdebug.mode=off \\
          .Build/vendor/bin/typoscript-lint -c Configuration/TsLint.yml --ansi -n --fail-on-warnings -vvv Configuration/Sets/
        else
          XDEBUG_MODE=\"debug,develop\" \\
          XDEBUG_TRIGGER=\"foo\" \\
          XDEBUG_CONFIG=\"client_port=${PHP_XDEBUG_PORT} client_host=host.docker.internal\" \\
          PHP_CS_FIXER_ALLOW_XDEBUG=1 \\
          .Build/vendor/bin/typoscript-lint -c Configuration/TsLint.yml --ansi -n --fail-on-warnings -vvv Configuration/Sets/
        fi
      "

  phpstan:
    image: ghcr.io/typo3/core-testing-${DOCKER_PHP_IMAGE}:latest
    user: "${HOST_UID}"
    volumes:
      - ${ROOT_DIR}:${ROOT_DIR}
    working_dir: ${ROOT_DIR}
    command: >
      /bin/sh -c "
        if [ ${SCRIPT_VERBOSE} -eq 1 ]; then
          set -x
        fi
        mkdir -p .Build/.cache
        php -v | grep '^PHP';
        php -dxdebug.mode=off .Build/vendor/bin/phpstan analyze --no-progress --no-interaction ${EXTRA_TEST_OPTIONS}
      "

  functional_sqlite:
    image: ghcr.io/typo3/core-testing-${DOCKER_PHP_IMAGE}:latest
    user: ${HOST_UID}
    volumes:
      - ${ROOT_DIR}:${ROOT_DIR}
    tmpfs:
      - ${ROOT_DIR}/.Build/Web/typo3temp/var/tests/functional-sqlite-dbs/:rw,noexec,nosuid,uid=${HOST_UID}
    environment:
      typo3DatabaseDriver: pdo_sqlite
    working_dir: ${ROOT_DIR}/.Build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      /bin/sh -c "
        if [ ${SCRIPT_VERBOSE} -eq 1 ]; then
          set -x
        fi
        php -v | grep '^PHP';
        if [ ${PHP_XDEBUG_ON} -eq 0 ]; then
          export XDEBUG_MODE=\"off\";
          vendor/bin/phpunit -c ../Tests/FunctionalTests.xml ${EXTRA_TEST_OPTIONS} --exclude-group not-sqlite ${TEST_FILE};
        else
          export XDEBUG_MODE=\"debug\";
          export XDEBUG_TRIGGER=\"foo\";
          export XDEBUG_CONFIG=\"client_port=${PHP_XDEBUG_PORT} client_host=`route -n | awk '/^0.0.0.0/ { print $$2 }'`\";
          vendor/bin/phpunit -c ../Tests/FunctionalTests.xml ${EXTRA_TEST_OPTIONS} --exclude-group not-sqlite ${TEST_FILE};
        fi
      "

  lint:
    image: ghcr.io/typo3/core-testing-${DOCKER_PHP_IMAGE}:latest
    user: ${HOST_UID}
    volumes:
      - ${ROOT_DIR}:${ROOT_DIR}
    working_dir: ${ROOT_DIR}
    command: >
      /bin/sh -c "
        if [ ${SCRIPT_VERBOSE} -eq 1 ]; then
          set -x
        fi
        php -v | grep '^PHP';
        find . -name \\*.php ! -path "./.Build/\\*" -print0 | xargs -0 -n1 -P4 php -dxdebug.mode=off -l >/dev/null
      "

  unit:
    image: ghcr.io/typo3/core-testing-${DOCKER_PHP_IMAGE}:latest
    user: ${HOST_UID}
    volumes:
      - ${ROOT_DIR}:${ROOT_DIR}
    working_dir: ${ROOT_DIR}
    command: >
      /bin/sh -c "
        if [ ${SCRIPT_VERBOSE} -eq 1 ]; then
          set -x
        fi
        php -v | grep '^PHP'
        if [ ${PHP_XDEBUG_ON} -eq 0 ]; then
          XDEBUG_MODE=\"off\" \
          .Build/vendor/bin/phpunit -c Build/UnitTests.xml ${EXTRA_TEST_OPTIONS} ${TEST_FILE};
        else
          DOCKER_HOST=`route -n | awk '/^0.0.0.0/ { print $$2 }'`
          XDEBUG_MODE=\"debug,develop\" \
          XDEBUG_TRIGGER=\"foo\" \
          XDEBUG_CONFIG=\"client_port=${PHP_XDEBUG_PORT} client_host=$${DOCKER_HOST}\" \
          .Build/vendor/bin/phpunit -c Build/UnitTests.xml ${EXTRA_TEST_OPTIONS} ${TEST_FILE};
        fi
      "
